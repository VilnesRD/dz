<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Установка Doczilla Integration</title>
<style>
  body { font-family: sans-serif; display: flex; align-items: center;
         justify-content: center; height: 100vh; margin: 0;
         background: #f5f5f5; color: #333; }
  .box { text-align: center; padding: 40px; }
  .spinner { width: 32px; height: 32px; border: 3px solid #ddd;
             border-top-color: #4f7cff; border-radius: 50%;
             animation: spin .7s linear infinite; margin: 16px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .success { display: none; color: #22c55e; font-size: 32px; margin: 12px 0; }
  .logo-wrap {
    width: 42px; height: 42px; margin: 0 auto;
    border-radius: 10px; overflow: hidden;
    border: 1px solid #e5e7eb; background: #fff;
  }
  .logo-wrap img { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div class="box">
  <div class="logo-wrap"><img src="/assets/doczilla-logo.png" alt="Doczilla"></div>
  <div style="font-size:18px;font-weight:600;margin:12px 0">Doczilla Integration</div>
  <div class="spinner" id="spinner"></div>
  <div class="success" id="success">✓</div>
  <div style="color:#888;font-size:13px" id="status">Установка приложения…</div>
</div>
<script src="//api.bitrix24.com/api/v1/"></script>
<script>
  function finish() {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('success').style.display = 'block';
    document.getElementById('status').textContent = 'Приложение установлено!';
    if (typeof BX24 !== 'undefined') {
      BX24.installFinish();
    }
  }

  if (typeof BX24 !== 'undefined') {
    BX24.init(finish);
  } else {
    // BX24.JS не загрузился — просто показываем успех
    window.addEventListener('load', finish);
  }

  // Страховка — через 3 секунды всё равно показываем успех
  setTimeout(finish, 3000);
</script>
</body>
</html>
